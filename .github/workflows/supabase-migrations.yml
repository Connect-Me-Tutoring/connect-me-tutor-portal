name: Supabase Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"

# Never let two pushes race each other against the prod database.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to prod
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations
        run: supabase migration list --linked

      # PRs into main only preview what would run; the real push happens after merge.
      - name: Dry run
        if: github.event_name == 'pull_request'
        run: supabase db push --dry-run

      - name: Apply migrations
        if: github.event_name != 'pull_request'
        run: supabase db push
