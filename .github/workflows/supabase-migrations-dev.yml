name: Supabase Migrations (dev)

# Every non-draft PR that changes supabase/migrations/ pushes its branch's
# migrations to the dev Supabase project: on open, on "Ready for review", and
# on each new commit (`db push` only runs migrations dev hasn't applied yet).
# Open the PR as a draft (or convert it back to draft) to keep a migration
# that's still in progress off the shared dev database.
#
# Applied migrations are not rolled back if the PR is closed without merging;
# revert them on dev by hand.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  apply-dev:
    name: Push migrations to dev
    # Skip drafts, and never run for forks (they get no secrets, and outside
    # contributors shouldn't be able to write to dev by opening a PR).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: supabase-dev
    # One push to dev at a time across all PRs; never cancel one mid-run.
    concurrency:
      group: supabase-migrations-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      SUPABASE_DEV_PROJECT_ID: ${{ secrets.SUPABASE_DEV_PROJECT_ID }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link dev project
        run: supabase link --project-ref "$SUPABASE_DEV_PROJECT_ID"

      - name: Show pending migrations
        run: supabase migration list --linked

      # --include-all: several PRs push to dev independently, so a branch's
      # migration can be older than one another PR already applied. Without it
      # `db push` refuses to run anything. Prod keeps the strict ordering.
      - name: Push migrations to dev
        run: supabase db push --include-all

      - name: Summary
        if: always()
        run: |
          {
            echo "### Supabase dev migrations"
            echo "PR #${{ github.event.pull_request.number }} at \`${{ github.event.pull_request.head.sha }}\` → dev project."
            echo
            echo '```'
            supabase migration list --linked 2>&1 | tail -n 15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
